# ============================================================
# Totem Dongle — Clean & Standard Kconfig
# ============================================================

# 1. 接続の基本（左右のキーボードと繋ぐ親機機能）
CONFIG_BT_CENTRAL=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# 2. 接続数を3台に設定（左手1 + 右手1 + PC用Bluetooth1 = 計3台）
# 以前の「7台」のビジー状態を解消し、メモリを軽量化します
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3

# 3. USB有線の有効化（この1行だけで、挿した時は自動で有線優先になります）
CONFIG_ZMK_USB=y

# 4. プライバシー機能をオフ（アドレス解決による負荷軽減）
CONFIG_BT_PRIVACY=n

# 5. ボード内蔵LEDのみ有効化
CONFIG_ZMK_LED_INDICATORS=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# battery reporting
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
