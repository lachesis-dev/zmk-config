# Dongle is the only Central
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Dongle handles 2 peripherals (left + right)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# USB HID enabled for dongle
CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_HID=y

# --- ペアリング（左右 TOTEM を同時接続） ---
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=2

# --- 電力 ---
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=30000