# Enable USB CDC ACM logging for debugging. Default=n
CONFIG_ZMK_USB_LOGGING=y

# 放置で切れないようにスリープを完全に切る（テストのため一旦オフを推奨）
CONFIG_ZMK_SLEEP=n

# Sleep timeout to 30 min
# CONFIG_ZMK_SLEEP=y
# CONFIG_PM_DEVICE=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# soft-off
# CONFIG_ZMK_PM_SOFT_OFF=y

# mouse emulation
CONFIG_ZMK_POINTING=y

# CONFIG_SETTINGS=y
# CONFIG_SETTINGS_NVS=y
# CONFIG_NVS=y
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
# CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=5000
# CONFIG_BT_PRIVACY=n

# zmk-rgbled-widget settings
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_INTERVAL_MS=250
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=50
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=1
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=2
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=3
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=5
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_7_COLOR=7
CONFIG_RGBLED_WIDGET_LAYER_8_COLOR=0
