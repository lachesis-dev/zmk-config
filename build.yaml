include:
  # Thorium34: build separate central firmware for each unit name
  - board: xiao_ble/nrf52840/zmk
    shield: thorium34_left
    artifact-name: thorium34snow_central_left
    cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME="Thorium34snow"

  - board: xiao_ble/nrf52840/zmk
    shield: thorium34_left
    artifact-name: thorium34black_central_left
    cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME="Thorium34black"

  - board: xiao_ble/nrf52840/zmk
    shield: thorium34_right
    artifact-name: thorium34_peripheral_right

  # totem left (central)
  - board: xiao_ble/nrf52840/zmk
    shield: totem_left
    artifact-name: totem_central_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y

  # totem right (peripheral)
  - board: xiao_ble/nrf52840/zmk
    shield: totem_right
    artifact-name: totem_peripheral_right

  # reset
  - board: xiao_ble/nrf52840/zmk
    shield: settings_reset
    artifact-name: totem_settings_reset
